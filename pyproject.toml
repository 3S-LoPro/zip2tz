[project]
name = "zip2info"
version = "1.0.0"
description = "Fast US ZIP code lookups for timezone and geocoordinates"
readme = "README.md"
authors = [
    { name = "kylehogate", email = "kyle.holgate@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "scripts/**",
    "data/**",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
